<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NBA Superteam Sim — Monte Carlo Analytics</title>
  <meta name="description" content="Simulación Monte Carlo de la temporada NBA 2026-27: proyecciones, standings, playoffs, premios y backtesting." />
  <meta name="theme-color" content="#100f0f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.nba.com" />

  <link rel="stylesheet" href="/css/tokens.css?v=4" />
  <link rel="stylesheet" href="/css/layout.css?v=3" />
  <link rel="stylesheet" href="/css/components.css?v=4" />
  <link rel="stylesheet" href="/css/hero.css?v=2" />
</head>
<body>
  <!-- Splash: mismo overlay e ids que consume views/splash.js -->
  <div class="splash" id="splash">
    <div class="splash-scroll">
      <div class="splash-content" id="splash-content"></div>
    </div>
  </div>

  <div class="app-shell">
    <!-- Masthead fijo: identidad + secciones. Fuera de .main para poder
         ocupar todo el ancho y quedarse pegado arriba al hacer scroll. -->
    <div class="masthead">
      <header class="topbar">
        <button type="button" class="team-identity team-identity-home" id="home-link" title="Volver a Inicio / Back to start">
          <div class="team-badge" id="header-badge">--</div>
          <div class="masthead-titles">
            <h1 id="page-title">NBA Superteam Simulator</h1>
            <p class="subtitle" id="page-subtitle">Cargando…</p>
          </div>
        </button>

        <div class="masthead-meta">
          <span class="masthead-stamp">Monte Carlo · Simulation Engine</span>
          <img
            class="brand-mark"
            src="https://cdn.nba.com/logos/leagues/logo-nba.svg"
            alt="NBA"
            onerror="this.style.display='none'"
          />
        </div>
      </header>

      <nav class="tabs" id="top-tabs" role="tablist" aria-label="Secciones">
        <button class="tab-button" role="tab" data-tab="mi-equipo" aria-selected="true">
          <span>Mi equipo</span>
          <span class="nav-en">My team</span>
        </button>
        <button class="tab-button" role="tab" data-tab="liga-nba" aria-selected="false">
          <span>Liga NBA</span>
          <span class="nav-en">League &amp; playoffs</span>
        </button>
        <button class="tab-button" role="tab" data-tab="explicador" aria-selected="false">
          <span>Explicador</span>
          <span class="nav-en">AI explainer</span>
        </button>
      </nav>
    </div>

    <main class="main">
      <section id="tab-mi-equipo" class="tab-panel">
        <nav class="subtabs" id="sub-tabs-team" role="tablist" aria-label="Vistas de Mi equipo">
          <button class="tab-button" role="tab" data-subtab="roster" aria-selected="true">
            <span>Roster y proyecciones</span>
            <span class="nav-en">Roster</span>
          </button>
          <button class="tab-button" role="tab" data-subtab="simulacion" aria-selected="false">
            <span>Simulación Monte Carlo</span>
            <span class="nav-en">Simulation</span>
          </button>
          <button class="tab-button" role="tab" data-subtab="sinergia" aria-selected="false">
            <span>Sinergia de alineación</span>
            <span class="nav-en">Lineup fit</span>
          </button>
          <button class="tab-button" role="tab" data-subtab="backtesting" aria-selected="false">
            <span>Backtesting</span>
            <span class="nav-en">Validation</span>
          </button>
        </nav>
        <div id="subtab-team-roster" class="subtab-panel"></div>
        <div id="subtab-team-simulacion" class="subtab-panel" hidden></div>
        <div id="subtab-team-sinergia" class="subtab-panel" hidden></div>
        <div id="subtab-team-backtesting" class="subtab-panel" hidden></div>
      </section>

      <section id="tab-liga-nba" class="tab-panel" hidden>
        <nav class="subtabs" id="sub-tabs-league" role="tablist" aria-label="Vistas de Liga NBA">
          <button class="tab-button" role="tab" data-subtab="liga" aria-selected="true">
            <span>Liga y Playoffs</span>
            <span class="nav-en">Standings</span>
          </button>
          <button class="tab-button" role="tab" data-subtab="lideres" aria-selected="false">
            <span>Líderes de estadísticas</span>
            <span class="nav-en">Stat leaders</span>
          </button>
          <button class="tab-button" role="tab" data-subtab="premios" aria-selected="false">
            <span>Premios individuales</span>
            <span class="nav-en">Awards</span>
          </button>
          <button class="tab-button" role="tab" data-subtab="campeones" aria-selected="false">
            <span>Campeones reales</span>
            <span class="nav-en">Real champions</span>
          </button>
        </nav>
        <div id="subtab-league-liga" class="subtab-panel"></div>
        <div id="subtab-league-lideres" class="subtab-panel" hidden></div>
        <div id="subtab-league-premios" class="subtab-panel" hidden></div>
        <div id="subtab-league-campeones" class="subtab-panel" hidden></div>
      </section>

      <section id="tab-explicador" class="tab-panel" hidden></section>
    </main>
  </div>

  <div class="chart-tooltip" id="chart-tooltip"></div>
  <div class="nav-transition" id="nav-transition" aria-hidden="true"></div>

  <dialog id="player-modal" class="detail-modal"></dialog>
  <dialog id="team-modal" class="detail-modal"></dialog>
  <dialog id="roster-picker-modal" class="detail-modal"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
